<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190b3b" />
      <stop offset="50%" stop-color="#2a085c" />
      <stop offset="100%" stop-color="#0c0220" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Orbit ring with glow -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="16 10" transform="rotate(-25 256 256)" filter="url(#glow)" opacity="0.85" />

  <!-- Mini math symbols orbiting -->
  <text x="75" y="190" fill="#00f5d4" font-family="system-ui, sans-serif" font-weight="900" font-size="44" opacity="0.9">+</text>
  <text x="400" y="360" fill="#ff70a6" font-family="system-ui, sans-serif" font-weight="900" font-size="48" opacity="0.9">×</text>
  <text x="390" y="160" fill="#ffe600" font-family="system-ui, sans-serif" font-weight="900" font-size="46" opacity="0.9">−</text>
  <text x="100" y="370" fill="#a78bfa" font-family="system-ui, sans-serif" font-weight="900" font-size="44" opacity="0.9">=</text>

  <!-- Central Star Mascot (Nova) -->
  <g filter="url(#glow)">
    <!-- 5-Point Cute Star -->
    <path d="M 256,90 
             L 294,204 
             L 416,204 
             L 318,278 
             L 355,394 
             L 256,322 
             L 157,394 
             L 194,278 
             L 96,204 
             L 218,204 Z" 
          fill="url(#starGrad)" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Nova's Cute Face -->
  <!-- Big Eyes -->
  <ellipse cx="225" cy="245" rx="14" ry="18" fill="#1e1035" />
  <ellipse cx="287" cy="245" rx="14" ry="18" fill="#1e1035" />
  <!-- Eye highlights -->
  <circle cx="221" cy="240" r="5" fill="#ffffff" />
  <circle cx="228" cy="250" r="2.5" fill="#ffffff" />
  <circle cx="283" cy="240" r="5" fill="#ffffff" />
  <circle cx="290" cy="250" r="2.5" fill="#ffffff" />
  <!-- Blushing cheeks -->
  <ellipse cx="205" cy="260" rx="11" ry="6" fill="#ff4d8d" opacity="0.6" />
  <ellipse cx="307" cy="260" rx="11" ry="6" fill="#ff4d8d" opacity="0.6" />
  <!-- Joyful Smile -->
  <path d="M 240,262 Q 256,278 272,262" fill="none" stroke="#1e1035" stroke-width="5" stroke-linecap="round" />

  <!-- Little sparkle stars -->
  <polygon points="170,120 174,132 186,136 174,140 170,152 166,140 154,136 166,132" fill="#fff" />
  <polygon points="360,110 363,120 373,123 363,126 360,136 357,126 347,123 357,120" fill="#fff" />
</svg>
